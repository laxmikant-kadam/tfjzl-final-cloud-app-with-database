{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | OnlineCourse</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
            <div class="ms-auto">
                <a class="btn btn-link text-white" href="{% url 'onlinecourse:registration' %}">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Login</h1>
                        <form action="{% url 'onlinecourse:login' %}" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label"><b>User Name</b></label>
                                <input id="username" class="form-control" type="text" name="username" placeholder="Enter user name" required>
                            </div>
                            <div class="mb-3">
                                <label for="psw" class="form-label"><b>Password</b></label>
                                <input id="psw" class="form-control" type="password" name="psw" placeholder="Enter password" required>
                            </div>
                            {% if message %}
                                <div class="alert alert-warning">{{ message }}</div>
                            {% endif %}
                            <button class="btn btn-primary w-100" type="submit">Login</button>
                        </form>
                        <p class="mt-3 mb-0 text-center">
                            New here? <a href="{% url 'onlinecourse:registration' %}">Create an account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
